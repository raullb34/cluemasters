baseURL = "https://www.cluemasters.es/"
languageCode = "es-ES"
defaultContentLanguage = "es"
title = "ClueMasters"
theme = "PaperMod"
uglyURLs = false
enableRobotsTXT = true
canonifyURLs = true

[sitemap]
  changefreq = "weekly"
  priority = 0.7
  filename = "sitemap.xml"

[permalinks]
  posts = "/posts/:slug/"

[params]
  description = "Escape rooms y juegos de misterio para jugar en casa: juegos gratis para imprimir, guías de candados y kits, y actividades para niños y familias."
  keywords = ["escape room", "kits", "juegos de mesa", "review", "blog", "reseñas", "juegos en casa", "scape rooms"]
  author = "ClueMasters"
  favicon = "/clue-masters.ico"
  ShowShareButtons = true
  ShowReadingTime = true
  ShowPostNavLinks = true
  showtoc = true
  tocopen = true
  disableThemeToggle = false
  env = "production"
  homeTitle = "ClueMasters: escape rooms y juegos de misterio para jugar en casa"

  [params.homeInfoParams]
    Title = "Escape rooms y juegos de misterio para jugar en casa"
    Content = "Juegos gratis para imprimir (también en PDF), guías de candados y kits, y actividades de detectives para niños, familias y amigos."

