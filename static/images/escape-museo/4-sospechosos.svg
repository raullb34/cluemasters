<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 760" width="820" height="760"><rect width="820" height="760" fill="#fff"/><text x="410.0" y="46" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="bold" fill="#1e4f9c" text-anchor="middle">FICHAS DE LOS SOSPECHOSOS</text><rect x="20" y="70" width="380" height="230" rx="16" fill="#f7f9fc" stroke="#1e4f9c" stroke-width="3"/><circle cx="72" cy="122" r="34" fill="#e0a800"/><text x="72" y="134" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="bold" fill="#1b1b1b" text-anchor="middle">1</text><text x="124" y="132" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="bold" fill="#1b1b1b" text-anchor="start">Sr. Gómez</text><text x="60" y="195" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="normal" fill="#1b1b1b" text-anchor="start">• Lleva gafas</text><text x="60" y="229" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="normal" fill="#1b1b1b" text-anchor="start">• Lleva sombrero</text><text x="60" y="263" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="normal" fill="#1b1b1b" text-anchor="start">• Es alto</text><rect x="420" y="70" width="380" height="230" rx="16" fill="#f7f9fc" stroke="#1e4f9c" stroke-width="3"/><circle cx="472" cy="122" r="34" fill="#e0a800"/><text x="472" y="134" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="bold" fill="#1b1b1b" text-anchor="middle">4</text><text x="524" y="132" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="bold" fill="#1b1b1b" text-anchor="start">Sra. Ruiz</text><text x="460" y="195" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="normal" fill="#1b1b1b" text-anchor="start">• No lleva gafas</text><text x="460" y="229" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="normal" fill="#1b1b1b" text-anchor="start">• Lleva gorra</text><text x="460" y="263" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="normal" fill="#1b1b1b" text-anchor="start">• Es alta</text><rect x="20" y="320" width="380" height="230" rx="16" fill="#f7f9fc" stroke="#1e4f9c" stroke-width="3"/><circle cx="72" cy="372" r="34" fill="#e0a800"/><text x="72" y="384" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="bold" fill="#1b1b1b" text-anchor="middle">5</text><text x="124" y="382" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="bold" fill="#1b1b1b" text-anchor="start">Sr. Pardo</text><text x="60" y="445" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="normal" fill="#1b1b1b" text-anchor="start">• No lleva gafas</text><text x="60" y="479" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="normal" fill="#1b1b1b" text-anchor="start">• Lleva gorra</text><text x="60" y="513" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="normal" fill="#1b1b1b" text-anchor="start">• Es bajito</text><rect x="420" y="320" width="380" height="230" rx="16" fill="#f7f9fc" stroke="#1e4f9c" stroke-width="3"/><circle cx="472" cy="372" r="34" fill="#e0a800"/><text x="472" y="384" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="bold" fill="#1b1b1b" text-anchor="middle">8</text><text x="524" y="382" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="bold" fill="#1b1b1b" text-anchor="start">Srta. Vela</text><text x="460" y="445" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="normal" fill="#1b1b1b" text-anchor="start">• Lleva gafas</text><text x="460" y="479" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="normal" fill="#1b1b1b" text-anchor="start">• Lleva gorra</text><text x="460" y="513" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="normal" fill="#1b1b1b" text-anchor="start">• Es bajita</text><text x="410.0" y="590" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" fill="#1e4f9c" text-anchor="middle">LO QUE VIO EL VIGILANTE:</text><text x="410.0" y="626" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="normal" fill="#1b1b1b" text-anchor="middle">El ladrón NO llevaba gafas.</text><text x="410.0" y="656" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="normal" fill="#1b1b1b" text-anchor="middle">Llevaba GORRA.</text><text x="410.0" y="686" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="normal" fill="#1b1b1b" text-anchor="middle">Era más BAJITO que el vigilante (que mide poco).</text><text x="410.0" y="730" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#1b1b1b" text-anchor="middle">El número del culpable es el TERCER número del candado.</text></svg>
