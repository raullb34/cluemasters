<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 620" width="760" height="620"><rect width="760" height="620" fill="#fff"/><text x="380.0" y="46" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="bold" fill="#c0392b" text-anchor="middle" >CUADERNO DE DETECTIVE</text><text x="380.0" y="80" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" fill="#1b1b1b" text-anchor="middle" >Tacha a cada sospechoso cuando una pista demuestre que es inocente.</text><rect x="40" y="110" width="680" height="58" rx="10" fill="#fff8e7" stroke="#1b1b1b" stroke-width="2"/><rect x="58" y="125" width="28" height="28" fill="#fff" stroke="#1b1b1b" stroke-width="2"/><text x="106" y="138" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" fill="#1b1b1b" text-anchor="start" >Bigotes, el gato</text><text x="106" y="160" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" fill="#1b1b1b" text-anchor="start" >Le encanta subirse a la mesa de la cocina.</text><rect x="40" y="180" width="680" height="58" rx="10" fill="#fff8e7" stroke="#1b1b1b" stroke-width="2"/><rect x="58" y="195" width="28" height="28" fill="#fff" stroke="#1b1b1b" stroke-width="2"/><text x="106" y="208" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" fill="#1b1b1b" text-anchor="start" >Toby, el perro</text><text x="106" y="230" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" fill="#1b1b1b" text-anchor="start" >Nunca dice que no a una galleta.</text><rect x="40" y="250" width="680" height="58" rx="10" fill="#fff8e7" stroke="#1b1b1b" stroke-width="2"/><rect x="58" y="265" width="28" height="28" fill="#fff" stroke="#1b1b1b" stroke-width="2"/><text x="106" y="278" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" fill="#1b1b1b" text-anchor="start" >El abuelo Paco</text><text x="106" y="300" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" fill="#1b1b1b" text-anchor="start" >Dice que las galletas de jengibre son sus favoritas.</text><rect x="40" y="320" width="680" height="58" rx="10" fill="#fff8e7" stroke="#1b1b1b" stroke-width="2"/><rect x="58" y="335" width="28" height="28" fill="#fff" stroke="#1b1b1b" stroke-width="2"/><text x="106" y="348" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" fill="#1b1b1b" text-anchor="start" >La prima Lucía</text><text x="106" y="370" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" fill="#1b1b1b" text-anchor="start" >Se quedó despierta hasta muy tarde.</text><rect x="40" y="390" width="680" height="58" rx="10" fill="#fff8e7" stroke="#1b1b1b" stroke-width="2"/><rect x="58" y="405" width="28" height="28" fill="#fff" stroke="#1b1b1b" stroke-width="2"/><text x="106" y="418" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" fill="#1b1b1b" text-anchor="start" >Papá Noel</text><text x="106" y="440" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" fill="#1b1b1b" text-anchor="start" >¿Habrá pasado ya por casa?</text><text x="380.0" y="490" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#c0392b" text-anchor="middle" >CÓDIGO DE LA CAJA FUERTE</text><rect x="275.0" y="505" width="60" height="64" rx="8" fill="#fff" stroke="#c0392b" stroke-width="3"/><rect x="350.0" y="505" width="60" height="64" rx="8" fill="#fff" stroke="#c0392b" stroke-width="3"/><rect x="425.0" y="505" width="60" height="64" rx="8" fill="#fff" stroke="#c0392b" stroke-width="3"/></svg>
