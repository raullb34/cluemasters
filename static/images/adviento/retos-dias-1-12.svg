<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1150" width="800" height="1150"><rect width="800" height="1150" fill="#fff"/><text x="400.0" y="40" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="bold" fill="#c0392b" text-anchor="middle">CALENDARIO DE ADVIENTO DEL DETECTIVE · DÍAS 1-12</text><rect x="16" y="61" width="248" height="258" rx="14" fill="#fffaf2" stroke="#c0392b" stroke-width="3" stroke-dasharray="10 6"/><circle cx="140.0" cy="107" r="32" fill="#c0392b"/><text x="140.0" y="119" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="bold" fill="#fff" text-anchor="middle">1</text><text x="140.0" y="167" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#1b1b1b" text-anchor="middle">Adivinanza:</text><text x="140.0" y="190" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#1b1b1b" text-anchor="middle">Tengo dientes</text><text x="140.0" y="213" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#1b1b1b" text-anchor="middle">pero no muerdo.</text><text x="140.0" y="236" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#1b1b1b" text-anchor="middle">¿Qué soy?</text><text x="140.0" y="299" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#2e7d32" font-weight="bold" text-anchor="middle">Letra secreta: ____</text><rect x="276" y="61" width="248" height="258" rx="14" fill="#fffaf2" stroke="#c0392b" stroke-width="3" stroke-dasharray="10 6"/><circle cx="400.0" cy="107" r="32" fill="#c0392b"/><text x="400.0" y="119" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="bold" fill="#fff" text-anchor="middle">2</text><text x="400.0" y="167" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#1b1b1b" text-anchor="middle">Encuentra 5 cosas</text><text x="400.0" y="190" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#1b1b1b" text-anchor="middle">ROJAS en casa</text><text x="400.0" y="213" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#1b1b1b" text-anchor="middle">en menos de</text><text x="400.0" y="236" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#1b1b1b" text-anchor="middle">2 minutos.</text><text x="400.0" y="299" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#2e7d32" font-weight="bold" text-anchor="middle">Letra secreta: ____</text><rect x="536" y="61" width="248" height="258" rx="14" fill="#fffaf2" stroke="#c0392b" stroke-width="3" stroke-dasharray="10 6"/><circle cx="660.0" cy="107" r="32" fill="#c0392b"/><text x="660.0" y="119" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="bold" fill="#fff" text-anchor="middle">3</text><text x="660.0" y="167" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#1b1b1b" text-anchor="middle">Descifra el código</text><text x="660.0" y="190" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#1b1b1b" text-anchor="middle">(A=1, B=2...):</text><text x="660.0" y="213" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#1b1b1b" text-anchor="middle">14-1-22-9-4-1-4</text><text x="660.0" y="299" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#2e7d32" font-weight="bold" text-anchor="middle">Letra secreta: ____</text><rect x="16" y="331" width="248" height="258" rx="14" fill="#fffaf2" stroke="#c0392b" stroke-width="3" stroke-dasharray="10 6"/><circle cx="140.0" cy="377" r="32" fill="#c0392b"/><text x="140.0" y="389" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="bold" fill="#fff" text-anchor="middle">4</text><text x="140.0" y="437" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#1b1b1b" text-anchor="middle">Dibuja un muñeco</text><text x="140.0" y="460" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#1b1b1b" text-anchor="middle">de nieve con los</text><text x="140.0" y="483" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#1b1b1b" text-anchor="middle">ojos cerrados.</text><text x="140.0" y="569" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#2e7d32" font-weight="bold" text-anchor="middle">Letra secreta: ____</text><rect x="276" y="331" width="248" height="258" rx="14" fill="#fffaf2" stroke="#c0392b" stroke-width="3" stroke-dasharray="10 6"/><circle cx="400.0" cy="377" r="32" fill="#c0392b"/><text x="400.0" y="389" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="bold" fill="#fff" text-anchor="middle">5</text><text x="400.0" y="437" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#1b1b1b" text-anchor="middle">Adivinanza:</text><text x="400.0" y="460" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#1b1b1b" text-anchor="middle">Subo y bajo</text><text x="400.0" y="483" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#1b1b1b" text-anchor="middle">sin moverme.</text><text x="400.0" y="506" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#1b1b1b" text-anchor="middle">¿Qué soy?</text><text x="400.0" y="569" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#2e7d32" font-weight="bold" text-anchor="middle">Letra secreta: ____</text><rect x="536" y="331" width="248" height="258" rx="14" fill="#fffaf2" stroke="#c0392b" stroke-width="3" stroke-dasharray="10 6"/><circle cx="660.0" cy="377" r="32" fill="#c0392b"/><text x="660.0" y="389" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="bold" fill="#fff" text-anchor="middle">6</text><text x="660.0" y="437" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#1b1b1b" text-anchor="middle">Lee este mensaje</text><text x="660.0" y="460" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#1b1b1b" text-anchor="middle">con un espejo:</text><g transform="translate(1320.0,0) scale(-1,1)"><text x="660.0" y="491" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#2e7d32" text-anchor="middle">DAME UN ABRAZO</text></g><text x="660.0" y="569" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#2e7d32" font-weight="bold" text-anchor="middle">Letra secreta: ____</text><rect x="16" y="601" width="248" height="258" rx="14" fill="#fffaf2" stroke="#c0392b" stroke-width="3" stroke-dasharray="10 6"/><circle cx="140.0" cy="647" r="32" fill="#c0392b"/><text x="140.0" y="659" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="bold" fill="#fff" text-anchor="middle">7</text><text x="140.0" y="707" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#1b1b1b" text-anchor="middle">Cuenta las bolas</text><text x="140.0" y="730" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#1b1b1b" text-anchor="middle">del árbol de</text><text x="140.0" y="753" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#1b1b1b" text-anchor="middle">Navidad. ¡Sin</text><text x="140.0" y="776" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#1b1b1b" text-anchor="middle">equivocarte!</text><text x="140.0" y="839" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#2e7d32" font-weight="bold" text-anchor="middle">Letra secreta: ____</text><rect x="276" y="601" width="248" height="258" rx="14" fill="#fffaf2" stroke="#c0392b" stroke-width="3" stroke-dasharray="10 6"/><circle cx="400.0" cy="647" r="32" fill="#c0392b"/><text x="400.0" y="659" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="bold" fill="#fff" text-anchor="middle">8</text><text x="400.0" y="707" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#1b1b1b" text-anchor="middle">Aprende a decir</text><text x="400.0" y="730" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#1b1b1b" text-anchor="middle">«Feliz Navidad»</text><text x="400.0" y="753" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#1b1b1b" text-anchor="middle">en 3 idiomas.</text><text x="400.0" y="839" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#2e7d32" font-weight="bold" text-anchor="middle">Letra secreta: ____</text><rect x="536" y="601" width="248" height="258" rx="14" fill="#fffaf2" stroke="#c0392b" stroke-width="3" stroke-dasharray="10 6"/><circle cx="660.0" cy="647" r="32" fill="#c0392b"/><text x="660.0" y="659" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="bold" fill="#fff" text-anchor="middle">9</text><text x="660.0" y="707" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#1b1b1b" text-anchor="middle">Adivinanza:</text><text x="660.0" y="730" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#1b1b1b" text-anchor="middle">Tengo agujas pero</text><text x="660.0" y="753" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#1b1b1b" text-anchor="middle">no sé coser. ¿Qué</text><text x="660.0" y="776" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#1b1b1b" text-anchor="middle">soy?</text><text x="660.0" y="839" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#2e7d32" font-weight="bold" text-anchor="middle">Letra secreta: ____</text><rect x="16" y="871" width="248" height="258" rx="14" fill="#fffaf2" stroke="#c0392b" stroke-width="3" stroke-dasharray="10 6"/><circle cx="140.0" cy="917" r="32" fill="#c0392b"/><text x="140.0" y="929" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="bold" fill="#fff" text-anchor="middle">10</text><text x="140.0" y="977" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#1b1b1b" text-anchor="middle">Un adulto esconde</text><text x="140.0" y="1000" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#1b1b1b" text-anchor="middle">un calcetín.</text><text x="140.0" y="1023" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#1b1b1b" text-anchor="middle">Encuéntralo con</text><text x="140.0" y="1046" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#1b1b1b" text-anchor="middle">«frío o caliente».</text><text x="140.0" y="1109" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#2e7d32" font-weight="bold" text-anchor="middle">Letra secreta: ____</text><rect x="276" y="871" width="248" height="258" rx="14" fill="#fffaf2" stroke="#c0392b" stroke-width="3" stroke-dasharray="10 6"/><circle cx="400.0" cy="917" r="32" fill="#c0392b"/><text x="400.0" y="929" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="bold" fill="#fff" text-anchor="middle">11</text><text x="400.0" y="977" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#1b1b1b" text-anchor="middle">Haz una tarjeta</text><text x="400.0" y="1000" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#1b1b1b" text-anchor="middle">de Navidad para</text><text x="400.0" y="1023" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#1b1b1b" text-anchor="middle">alguien de tu</text><text x="400.0" y="1046" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#1b1b1b" text-anchor="middle">familia.</text><text x="400.0" y="1109" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#2e7d32" font-weight="bold" text-anchor="middle">Letra secreta: ____</text><rect x="536" y="871" width="248" height="258" rx="14" fill="#fffaf2" stroke="#c0392b" stroke-width="3" stroke-dasharray="10 6"/><circle cx="660.0" cy="917" r="32" fill="#c0392b"/><text x="660.0" y="929" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="bold" fill="#fff" text-anchor="middle">12</text><text x="660.0" y="977" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#1b1b1b" text-anchor="middle">Papá Noel tiene</text><text x="660.0" y="1000" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#1b1b1b" text-anchor="middle">9 renos y 3 se</text><text x="660.0" y="1023" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#1b1b1b" text-anchor="middle">van a dormir.</text><text x="660.0" y="1046" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#1b1b1b" text-anchor="middle">¿Cuántos tiran?</text><text x="660.0" y="1109" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#2e7d32" font-weight="bold" text-anchor="middle">Letra secreta: ____</text></svg>
