<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1150" width="800" height="1150"><rect width="800" height="1150" fill="#fff"/><text x="400.0" y="40" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="bold" fill="#c0392b" text-anchor="middle">CALENDARIO DE ADVIENTO DEL DETECTIVE · DÍAS 13-24</text><rect x="16" y="61" width="248" height="258" rx="14" fill="#fffaf2" stroke="#c0392b" stroke-width="3" stroke-dasharray="10 6"/><circle cx="140.0" cy="107" r="32" fill="#c0392b"/><text x="140.0" y="119" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="bold" fill="#fff" text-anchor="middle">13</text><text x="140.0" y="167" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#1b1b1b" text-anchor="middle">Con los ojos tapados,</text><text x="140.0" y="190" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#1b1b1b" text-anchor="middle">llega del sofá</text><text x="140.0" y="213" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#1b1b1b" text-anchor="middle">al árbol solo con</text><text x="140.0" y="236" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#1b1b1b" text-anchor="middle">las indicaciones.</text><text x="140.0" y="299" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#2e7d32" font-weight="bold" text-anchor="middle">Letra secreta: ____</text><rect x="276" y="61" width="248" height="258" rx="14" fill="#fffaf2" stroke="#c0392b" stroke-width="3" stroke-dasharray="10 6"/><circle cx="400.0" cy="107" r="32" fill="#c0392b"/><text x="400.0" y="119" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="bold" fill="#fff" text-anchor="middle">14</text><text x="400.0" y="167" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#1b1b1b" text-anchor="middle">Lee al revés:</text><text x="400.0" y="190" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#1b1b1b" text-anchor="middle">S O L A G E R</text><text x="400.0" y="299" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#2e7d32" font-weight="bold" text-anchor="middle">Letra secreta: ____</text><rect x="536" y="61" width="248" height="258" rx="14" fill="#fffaf2" stroke="#c0392b" stroke-width="3" stroke-dasharray="10 6"/><circle cx="660.0" cy="107" r="32" fill="#c0392b"/><text x="660.0" y="119" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="bold" fill="#fff" text-anchor="middle">15</text><text x="660.0" y="167" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#1b1b1b" text-anchor="middle">Mira 10 objetos</text><text x="660.0" y="190" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#1b1b1b" text-anchor="middle">30 segundos. Un</text><text x="660.0" y="213" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#1b1b1b" text-anchor="middle">adulto quita uno.</text><text x="660.0" y="236" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#1b1b1b" text-anchor="middle">¿Cuál falta?</text><text x="660.0" y="299" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#2e7d32" font-weight="bold" text-anchor="middle">Letra secreta: ____</text><rect x="16" y="331" width="248" height="258" rx="14" fill="#fffaf2" stroke="#c0392b" stroke-width="3" stroke-dasharray="10 6"/><circle cx="140.0" cy="377" r="32" fill="#c0392b"/><text x="140.0" y="389" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="bold" fill="#fff" text-anchor="middle">16</text><text x="140.0" y="437" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#1b1b1b" text-anchor="middle">Toma tus huellas</text><text x="140.0" y="460" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#1b1b1b" text-anchor="middle">con lápiz y celo.</text><text x="140.0" y="483" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#1b1b1b" text-anchor="middle">¿Son iguales</text><text x="140.0" y="506" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#1b1b1b" text-anchor="middle">que las de papá?</text><text x="140.0" y="569" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#2e7d32" font-weight="bold" text-anchor="middle">Letra secreta: ____</text><rect x="276" y="331" width="248" height="258" rx="14" fill="#fffaf2" stroke="#c0392b" stroke-width="3" stroke-dasharray="10 6"/><circle cx="400.0" cy="377" r="32" fill="#c0392b"/><text x="400.0" y="389" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="bold" fill="#fff" text-anchor="middle">17</text><text x="400.0" y="437" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#1b1b1b" text-anchor="middle">Canta un</text><text x="400.0" y="460" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#1b1b1b" text-anchor="middle">villancico entero</text><text x="400.0" y="483" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#1b1b1b" text-anchor="middle">sin equivocarte.</text><text x="400.0" y="569" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#2e7d32" font-weight="bold" text-anchor="middle">Letra secreta: ____</text><rect x="536" y="331" width="248" height="258" rx="14" fill="#fffaf2" stroke="#c0392b" stroke-width="3" stroke-dasharray="10 6"/><circle cx="660.0" cy="377" r="32" fill="#c0392b"/><text x="660.0" y="389" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="bold" fill="#fff" text-anchor="middle">18</text><text x="660.0" y="437" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#1b1b1b" text-anchor="middle">Adivinanza:</text><text x="660.0" y="460" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#1b1b1b" text-anchor="middle">Vuelo sin alas,</text><text x="660.0" y="483" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#1b1b1b" text-anchor="middle">lloro sin ojos.</text><text x="660.0" y="506" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#1b1b1b" text-anchor="middle">¿Qué soy?</text><text x="660.0" y="569" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#2e7d32" font-weight="bold" text-anchor="middle">Letra secreta: ____</text><rect x="16" y="601" width="248" height="258" rx="14" fill="#fffaf2" stroke="#c0392b" stroke-width="3" stroke-dasharray="10 6"/><circle cx="140.0" cy="647" r="32" fill="#c0392b"/><text x="140.0" y="659" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="bold" fill="#fff" text-anchor="middle">19</text><text x="140.0" y="707" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#1b1b1b" text-anchor="middle">Revela el mensaje</text><text x="140.0" y="730" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#1b1b1b" text-anchor="middle">invisible con</text><text x="140.0" y="753" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#1b1b1b" text-anchor="middle">ayuda de un adulto</text><text x="140.0" y="776" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#1b1b1b" text-anchor="middle">(¡zumo de limón!).</text><text x="140.0" y="839" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#2e7d32" font-weight="bold" text-anchor="middle">Letra secreta: ____</text><rect x="276" y="601" width="248" height="258" rx="14" fill="#fffaf2" stroke="#c0392b" stroke-width="3" stroke-dasharray="10 6"/><circle cx="400.0" cy="647" r="32" fill="#c0392b"/><text x="400.0" y="659" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="bold" fill="#fff" text-anchor="middle">20</text><text x="400.0" y="707" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#1b1b1b" text-anchor="middle">Ordena las letras</text><text x="400.0" y="730" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#1b1b1b" text-anchor="middle">y descubre el</text><text x="400.0" y="753" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#1b1b1b" text-anchor="middle">animal navideño:</text><text x="400.0" y="776" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#1b1b1b" text-anchor="middle">R O N E</text><text x="400.0" y="839" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#2e7d32" font-weight="bold" text-anchor="middle">Letra secreta: ____</text><rect x="536" y="601" width="248" height="258" rx="14" fill="#fffaf2" stroke="#c0392b" stroke-width="3" stroke-dasharray="10 6"/><circle cx="660.0" cy="647" r="32" fill="#c0392b"/><text x="660.0" y="659" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="bold" fill="#fff" text-anchor="middle">21</text><text x="660.0" y="707" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#1b1b1b" text-anchor="middle">Adivina el personaje</text><text x="660.0" y="730" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#1b1b1b" text-anchor="middle">navideño que piensa</text><text x="660.0" y="753" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#1b1b1b" text-anchor="middle">un adulto con</text><text x="660.0" y="776" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#1b1b1b" text-anchor="middle">preguntas de sí/no.</text><text x="660.0" y="839" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#2e7d32" font-weight="bold" text-anchor="middle">Letra secreta: ____</text><rect x="16" y="871" width="248" height="258" rx="14" fill="#fffaf2" stroke="#c0392b" stroke-width="3" stroke-dasharray="10 6"/><circle cx="140.0" cy="917" r="32" fill="#c0392b"/><text x="140.0" y="929" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="bold" fill="#fff" text-anchor="middle">22</text><text x="140.0" y="977" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#1b1b1b" text-anchor="middle">Haz una cadena</text><text x="140.0" y="1000" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#1b1b1b" text-anchor="middle">de papel para</text><text x="140.0" y="1023" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#1b1b1b" text-anchor="middle">decorar tu</text><text x="140.0" y="1046" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#1b1b1b" text-anchor="middle">habitación.</text><text x="140.0" y="1109" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#2e7d32" font-weight="bold" text-anchor="middle">Letra secreta: ____</text><rect x="276" y="871" width="248" height="258" rx="14" fill="#fffaf2" stroke="#c0392b" stroke-width="3" stroke-dasharray="10 6"/><circle cx="400.0" cy="917" r="32" fill="#c0392b"/><text x="400.0" y="929" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="bold" fill="#fff" text-anchor="middle">23</text><text x="400.0" y="977" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#1b1b1b" text-anchor="middle">Junta todas tus</text><text x="400.0" y="1000" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#1b1b1b" text-anchor="middle">letras secretas en</text><text x="400.0" y="1023" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#1b1b1b" text-anchor="middle">orden. ¿Qué</text><text x="400.0" y="1046" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#1b1b1b" text-anchor="middle">mensaje forman?</text><rect x="536" y="871" width="248" height="258" rx="14" fill="#fffaf2" stroke="#c0392b" stroke-width="3" stroke-dasharray="10 6"/><circle cx="660.0" cy="917" r="32" fill="#c0392b"/><text x="660.0" y="929" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="bold" fill="#fff" text-anchor="middle">24</text><text x="660.0" y="977" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#1b1b1b" text-anchor="middle">¡NOCHEBUENA!</text><text x="660.0" y="1000" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#1b1b1b" text-anchor="middle">Última pista:</text><text x="660.0" y="1023" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#1b1b1b" text-anchor="middle">busca debajo</text><text x="660.0" y="1046" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#1b1b1b" text-anchor="middle">del árbol.</text></svg>
